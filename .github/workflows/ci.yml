name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install zsh
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zsh
      - name: Generate carapace completers
        working-directory: third_party/carapace-bin
        run: go generate ./cmd/...
      - name: Test
        run: go test -tags release ./cmd/... ./internal/... ./shell/...

  # The harness checks (.omp/hooks/post) and the release config: a release
  # (make release) requires this workflow green for the commit it tags.
  release-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Harness checks
        run: make check-makefiles check-omp-hooks check-omp-rules check-omp-skills check-release
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: check
